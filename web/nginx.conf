# Sirve la página estática en el puerto 8081 (para el túnel: http://web:8081).
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Datos en vivo (los escribe el sidecar latest-json, montado en /srv/data).
    # Sin caché para que la página siempre reciba el último valor.
    location /data/ {
        alias /srv/data/;
        add_header Cache-Control "no-store, max-age=0";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
    }
}
