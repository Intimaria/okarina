[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"

# Ingesta de nodos ESP32 (MQTT). Un topic por <type>/<device>.
# El payload es JSON: {"type":"...","device":"...","seq":N,"ts":<unix s>, ...fields}.
# type/device se convierten en tags; ts pasa a ser el timestamp de InfluxDB.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  topics = ["iot/+/+/telemetry"]
  qos = 0
  client_id = "telegraf-ingest"
  data_format = "json"
  tag_keys = ["type", "device"]
  json_time_key = "ts"
  json_time_format = "unix"
  name_override = "telemetry"

