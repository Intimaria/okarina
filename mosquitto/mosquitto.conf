per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

# Listener interno (solo red de docker, para Telegraf) — no publicado al host.
listener 1883 0.0.0.0

# Listener público: MQTT over TLS.
listener 443 0.0.0.0
certfile /mosquitto/config/certs/fullchain.pem
keyfile /mosquitto/config/certs/privkey.pem

log_dest stdout
log_type notice
log_type error
