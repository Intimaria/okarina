<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Arquitectura — plataforma de telemetría del evento</text>

  <!-- Nodos (izquierda) -->
  <rect x="40" y="120" width="180" height="230" rx="10" fill="#eef2ff" stroke="#3949ab" stroke-width="2"/>
  <text x="130" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#3949ab">Nodos ESP32</text>
  <rect x="60" y="165" width="140" height="34" rx="6" fill="#c5cae9"/>
  <text x="130" y="187" text-anchor="middle" font-size="13" fill="#222">co2 — SCD41 + INMP441</text>
  <rect x="60" y="208" width="140" height="34" rx="6" fill="#c5cae9"/>
  <text x="130" y="230" text-anchor="middle" font-size="13" fill="#222">air — MQ135 + DHT22</text>
  <rect x="60" y="251" width="140" height="34" rx="6" fill="#c5cae9"/>
  <text x="130" y="273" text-anchor="middle" font-size="13" fill="#222">power — SCT-013</text>
  <text x="130" y="315" text-anchor="middle" font-size="11" fill="#666">publican JSON a</text>
  <text x="130" y="330" text-anchor="middle" font-size="11" fill="#666">iot/&lt;type&gt;/&lt;device&gt;/telemetry</text>

  <!-- Mosquitto -->
  <rect x="285" y="180" width="150" height="90" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="360" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Mosquitto</text>
  <text x="360" y="235" text-anchor="middle" font-size="12" fill="#333">broker MQTT</text>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#666">auth user/pass</text>

  <!-- Telegraf -->
  <rect x="500" y="180" width="150" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="575" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Telegraf</text>
  <text x="575" y="235" text-anchor="middle" font-size="12" fill="#333">ingesta</text>
  <text x="575" y="252" text-anchor="middle" font-size="11" fill="#666">mqtt_consumer + http</text>

  <!-- InfluxDB -->
  <rect x="715" y="180" width="150" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="790" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">InfluxDB</text>
  <text x="790" y="235" text-anchor="middle" font-size="12" fill="#333">series temporales</text>
  <text x="790" y="252" text-anchor="middle" font-size="11" fill="#666">medición telemetry</text>

  <!-- API WiFi (arriba) -->
  <rect x="500" y="55" width="150" height="60" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="575" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">API proveedor WiFi</text>
  <text x="575" y="98" text-anchor="middle" font-size="11" fill="#666">(pendiente de spec)</text>

  <!-- Flechas -->
  <line x1="220" y1="225" x2="278" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="249" y="216" text-anchor="middle" font-size="11" fill="#555">MQTT</text>

  <line x1="435" y1="225" x2="493" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464" y="216" text-anchor="middle" font-size="11" fill="#555">subscribe</text>

  <line x1="650" y1="225" x2="708" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="679" y="216" text-anchor="middle" font-size="11" fill="#555">line protocol</text>

  <line x1="575" y1="115" x2="575" y2="173" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="150" font-size="11" fill="#555">HTTP</text>

  <!-- Grafana (derecha) -->
  <rect x="815" y="250" width="155" height="70" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="892" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a1b9a">Grafana</text>
  <text x="892" y="300" text-anchor="middle" font-size="11" fill="#333">dashboards por tipo</text>
  <line x1="790" y1="270" x2="880" y2="285" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="500" y="400" text-anchor="middle" font-size="11" fill="#888">Todo el backend corre como docker compose; secretos con sops/AGE + direnv.</text>
</svg>
