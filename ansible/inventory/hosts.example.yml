# Inventario de ejemplo. Copialo a hosts.yml (gitignored) y poné el host real:
#   cp ansible/inventory/hosts.example.yml ansible/inventory/hosts.yml
---
all:
  hosts:
    mqtt:
      ansible_host: mqtt.example.com
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
      ansible_python_interpreter: /usr/bin/python3
      ansible_become: true
