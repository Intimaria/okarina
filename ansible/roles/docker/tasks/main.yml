---
- name: Instalar dependencias base
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, rsync, python3-pip]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Instalar PyYAML (requerido por docker_compose_v2)
  ansible.builtin.apt:
    name: python3-yaml
    state: present

- name: Crear /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar y dearmorar key GPG de Docker
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Agregar repo apt de Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Instalar Docker + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Asegurar que Docker corra y esté habilitado
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Agregar al usuario ubuntu al grupo docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
