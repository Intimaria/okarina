# Plantilla de secretos. Copiar a secrets.plain.yaml, editar, y cifrar con:
#   sops -e secrets.plain.yaml > secrets.enc.yaml
# El cifrado (secrets.enc.yaml) es lo que se commitea.
# usar valores SIN $ * ^ ` comillas ni espacios (rompen shell/compose).

MQTT_USER: nodos
MQTT_PASS: cambiar-esta-clave
GRAFANA_ADMIN_PASSWORD: cambiar-esta-clave
CF_TUNNEL_TOKEN: cambiar-este-token
mosquitto_domain: mqtt.example.com     # hostname del broker (subject del cert Let's Encrypt)
cert_email: vos@example.com            # contacto para Let's Encrypt
